name: Spring Batch and Disruptor comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Build and verify transaction behavior
        run: ./gradlew batchComparisonTest batchComparisonDistribution --console=plain
      - name: Compare complete jobs in fresh JVMs
        shell: bash
        run: |
          for repetition in 1 2 3 4 5; do
            if ((repetition % 2)); then
              modes=(SPRING DISRUPTOR)
              workloads=(64 4096)
              chunks=(128 1024)
            else
              modes=(DISRUPTOR SPRING)
              workloads=(4096 64)
              chunks=(1024 128)
            fi
            for work in "${workloads[@]}"; do
              for chunk in "${chunks[@]}"; do
                for mode in "${modes[@]}"; do
                  result="build/reports/batch-comparison/$repetition-w$work-c$chunk-$mode.json"
                  java -da -Xms512m -Xmx512m -cp 'build/batch-comparison/lib/*' \
                    com.lmax.disruptor.batchcompare.SpringBatchComparison \
                    "$mode" 250000 "$work" "$chunk" 5 3 "$result"
                done
              done
            done
          done
      - name: Summarize fork medians
        run: |
          python3 - <<'PY'
          import json
          import statistics
          from pathlib import Path
          root = Path('build/reports/batch-comparison')
          summary = []
          for work in [64, 4096]:
              for chunk in [128, 1024]:
                  row = {'cpuRounds': work, 'chunkSize': chunk}
                  results = {}
                  for mode in ['SPRING', 'DISRUPTOR']:
                      results[mode] = [json.loads((root / f'{rep}-w{work}-c{chunk}-{mode}.json').read_text()) for rep in range(1, 6)]
                      times = [statistics.median(s['seconds'] for s in r['samples']) for r in results[mode]]
                      cpus = [statistics.median(s['cpuSeconds'] for s in r['samples']) for r in results[mode]]
                      row[mode] = {'forks': len(times), 'medianSeconds': statistics.median(times), 'medianCpuSeconds': statistics.median(cpus)}
                  for first, second in zip(results['SPRING'], results['DISRUPTOR']):
                      assert first['samples'][0]['checksum'] == second['samples'][0]['checksum']
                      assert first['samples'][0]['commits'] == second['samples'][0]['commits']
                  summary.append(row)
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY
      - name: Save measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spring-batch-comparison-${{ github.sha }}
          path: build/reports/batch-comparison
          if-no-files-found: error
