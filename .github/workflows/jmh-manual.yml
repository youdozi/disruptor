name: JMH baseline

on:
  workflow_dispatch:
    inputs:
      assertions:
        description: Enable Java assertions in benchmark forks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Run production benchmarks
        env:
          JMH_ASSERTIONS: ${{ inputs.assertions }}
        run: ./gradlew jmh '-PjmhIncludes=com.lmax.disruptor.(ProductionSequencerBenchmark|SingleProducerSingleConsumer|MultiProducerSingleConsumer).*' -PjmhProfilers=gc -PjmhAssertions="$JMH_ASSERTIONS" --console=plain
      - name: Save results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jmh-${{ github.sha }}
          path: build/reports/jmh
          if-no-files-found: error
