name: Platform and virtual thread comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Build comparison runner
        run: ./gradlew clean perfJar --console=plain
      - name: Compare thread models in separate JVMs
        shell: bash
        run: |
          perf_jars=(build/libs/disruptor-perf-*.jar)
          test "${#perf_jars[@]}" -eq 1
          for repetition in 1 2; do
            for workload in CPU WAIT; do
              for wait_strategy in BLOCKING BUSY_SPIN; do
                for streams in 1 16; do
                  for producer in PLATFORM VIRTUAL; do
                    for consumer in PLATFORM VIRTUAL; do
                      result="build/reports/thread-model/$repetition-$workload-$wait_strategy-$streams-$producer-$consumer.json"
                      java -da -Xms256m -Xmx256m -cp "${perf_jars[0]}" \
                        com.lmax.disruptor.ThreadModelComparison \
                        "$producer" "$consumer" "$wait_strategy" "$workload" "$streams" 16 2 3 "$result"
                    done
                  done
                done
              done
            done
          done
      - name: Save comparison results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thread-model-${{ github.sha }}
          path: build/reports/thread-model
          if-no-files-found: error
