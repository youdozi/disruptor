name: Java CI with Gradle

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      batch_environments:
        description: Run the extended batch comparison on Linux and macOS
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.batch_environments
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        java: [ 25 ]
        os: [ ubuntu-latest, macos-latest ]
    name: Java ${{ matrix.java }} / ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Build with Gradle
        run: ./gradlew build examplesClasses jmhJar jcstressClasses perfJar batchComparisonDistribution --console=plain
      - name: Check Spring Batch comparison
        shell: bash
        run: |
          for mode in SPRING DISRUPTOR; do
            java -ea -Xms512m -Xmx512m -cp 'build/batch-comparison/lib/*' \
              com.lmax.disruptor.batchcompare.SpringBatchComparison \
              "$mode" 1000 64 128 1 1 "build/reports/batch-comparison/$mode.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          results = [json.loads(Path(f'build/reports/batch-comparison/{mode}.json').read_text()) for mode in ['SPRING', 'DISRUPTOR']]
          assert all(r['springBatch'] == '6.0.6' and r['springFramework'] == '7.0.10' for r in results)
          samples = [r['samples'][0] for r in results]
          assert all(s['rows'] == 1000 and s['rollbacks'] == 0 for s in samples)
          assert samples[0]['checksum'] == samples[1]['checksum'] and samples[0]['commits'] == samples[1]['commits']
          PY
      - name: Check parallel and file-backed comparison paths
        run: python3 src/batchcompare/run_matrix.py --quick --scenarios cpu_workers4,sha256_small_heap,file_input_output --output build/reports/batch-matrix-smoke
      - name: Check virtual-thread comparison runner
        run: ./gradlew threadModel -PthreadProducer=VIRTUAL -PthreadConsumer=VIRTUAL -PthreadWarmupSeconds=1 -PthreadMeasureSeconds=1 --console=plain
      - name: Check CPU publication batches
        run: |
          ./gradlew threadModel -PthreadWait=BUSY_SPIN -PthreadBatchSize=8 -PthreadHandlerWork=256 -PthreadWarmupSeconds=1 -PthreadMeasureSeconds=1 -PthreadOutput=build/reports/thread-model/cpu-batch.json --console=plain
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('build/reports/thread-model/cpu-batch.json').read_text())
          assert result['status'] == 'OK' and result['batchSize'] == 8 and result['handlerWork'] == 256
          assert 1 <= result['averagePublicationBatchSize'] <= 8
          assert 0 <= result['censored'] <= result['inFlight']
          PY
      - name: Check blocking publication benchmark
        shell: bash
        run: |
          jmh_jars=(build/libs/*-jmh.jar)
          test "${#jmh_jars[@]}" -eq 1
          mkdir -p build/reports/jmh
          java -jar "${jmh_jars[0]}" 'com.lmax.disruptor.BlockingPublicationBenchmark.publish$' \
            -p waitStrategy=BLOCKING -t 4 -bm thrpt -f 1 -wi 0 -i 1 -r 100ms \
            -prof com.lmax.disruptor.ProcessCpuProfiler -foe true \
            -jvmArgs '-da -Xms128m -Xmx128m' \
            -rf json -rff build/reports/jmh/blocking-smoke.json
          java -jar "${jmh_jars[0]}" 'com.lmax.disruptor.BlockingPublicationBenchmark.publish$' \
            -p waitStrategy=BUSY_SPIN -p bufferSize=16 -p handlerWork=256 \
            -t 1 -bm sample -f 1 -wi 0 -i 1 -r 100ms \
            -prof com.lmax.disruptor.ProcessCpuProfiler -foe true \
            -jvmArgs '-da -Xms128m -Xmx128m' \
            -rf json -rff build/reports/jmh/backpressure-smoke.json
      - name: Archive artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libs-and-reports-${{ matrix.java }}-${{ matrix.os }}
          path: |
            build/libs
            build/reports
            build/batch-comparison

  batch-environments:
    if: github.event_name == 'workflow_dispatch' && inputs.batch_environments
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Build and verify comparisons
        run: ./gradlew build batchComparisonDistribution --console=plain
      - name: Run the extended matrix
        run: python3 src/batchcompare/run_matrix.py --forks 3 --output build/reports/batch-environments
      - name: Save comparison measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: batch-environments-${{ matrix.os }}
          path: build/reports/batch-environments
          if-no-files-found: error
