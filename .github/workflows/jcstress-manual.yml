name: JCStress Testing - manual testing

on:
  workflow_dispatch:
    inputs :
      mode :
        description : 'JCStress run mode: sanity, quick, default, tough, stress'
        required : true
        default : 'default'
        type: choice
        options: [ sanity, quick, default, tough, stress ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 25 ]
    name: Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Build with Gradle
        env:
          JCSTRESS_MODE: ${{ inputs.mode }}
        run: ./gradlew jcstress -Pmode="$JCSTRESS_MODE"
      - name: Archive artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jcstress-report-manual-${{ matrix.java }}
          path: build/reports/jcstress
