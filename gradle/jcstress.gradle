//
// Configure JCStress
//

jcstress {
    jcstressDependency = 'org.openjdk.jcstress:jcstress-core:0.16'
    includeTests = true
    mode = providers.gradleProperty('mode').getOrElse('quick')
    regexp = providers.gradleProperty('jcstressTests').getOrElse('com.lmax.disruptor.*')
    cpuCount = providers.gradleProperty('jcstressCpus').getOrElse('2')
    affinityMode = providers.gradleProperty('jcstressAffinity').getOrElse('NONE')
}
