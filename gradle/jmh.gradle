//
// Configure JMH benchmarks
//

sourceSets {
    jmh {
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

def jmhLibVersion = '1.37'

dependencies {
    jmhImplementation "org.openjdk.jmh:jmh-core:${jmhLibVersion}"
    jmhAnnotationProcessor "org.openjdk.jmh:jmh-generator-annprocess:${jmhLibVersion}"

    jmhImplementation 'net.openhft:affinity:3.23.2'
}

jmh {
    jmhVersion = jmhLibVersion
    jvmArgsPrepend = ['-Xms256m', '-Xmx256m', '-XX:MaxDirectMemorySize=1g']
    resultsFile.set(project.file("${project.buildDir}/reports/jmh/result.json"))
    resultFormat = 'JSON'
    failOnError = true
    verbosity = 'NORMAL'
    includeTests = true
    includes = [providers.gradleProperty('jmhIncludes').getOrElse('.*')]
    fork = providers.gradleProperty('jmhForks').getOrElse('2').toInteger()
    warmupIterations = providers.gradleProperty('jmhWarmupIterations').getOrElse('5').toInteger()
    iterations = providers.gradleProperty('jmhIterations').getOrElse('5').toInteger()
    warmup = providers.gradleProperty('jmhWarmupTime').getOrElse('1s')
    timeOnIteration = providers.gradleProperty('jmhIterationTime').getOrElse('1s')
    if (providers.gradleProperty('jmhProfilers').isPresent())
    {
        profilers = providers.gradleProperty('jmhProfilers').get().split(',').toList()
    }
}

task jmhProfilers(type: JavaExec, description:'Lists the available profilers for the jmh task', group: 'jmh') {
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass.set('org.openjdk.jmh.Main')
    args '-lprof'
}
